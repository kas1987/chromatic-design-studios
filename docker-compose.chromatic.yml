name: chromatic-design-studios

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: cds-litellm
    ports:
      - "4000:4000"
    env_file:
      - .env
    volumes:
      - ./services/litellm/config.example.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    profiles: ["ai"]

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: cds-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    profiles: ["automation"]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: cds-open-webui
    ports:
      - "3001:8080"
    volumes:
      - open_webui_data:/app/backend/data
    profiles: ["ai"]

  ollama:
    image: ollama/ollama:latest
    container_name: cds-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["local-models"]

  postgres:
    image: postgres:16-alpine
    container_name: cds-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ccs
      POSTGRES_USER: ccs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    profiles: ["db"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccs -d ccs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  open_webui_data:
  ollama_data:
  postgres_data:
