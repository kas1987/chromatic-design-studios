  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ------------------------------------------------------------\n     1. BASE — cathedral floor → app shell → surface → elevated\n     ------------------------------------------------------------ */\n  --ch-bg-deep:      #050812;\n  --ch-bg-shell:     #0f1117;\n  --ch-bg-surface:   #141a2e;\n  --ch-bg-elevated:  #1e2842;\n\n  --ch-card-bg:      rgba(18, 22, 36, 0.72);\n  --ch-card-border:  rgba(167, 139, 250, 0.28);\n  --ch-card-border-hi: rgba(167, 139, 250, 0.55);\n\n  /* ------------------------------------------------------------\n     2. TEXT — white-on-navy, never pure gray\n     ------------------------------------------------------------ */\n  --ch-text-main:      #f8fafc;\n  --ch-text-secondary: #cbd5e1;\n  --ch-text-muted:     #94a3b8;\n  --ch-text-disabled:  rgba(248, 250, 252, 0.32);\n  --ch-text-on-bright: #050812;\n\n  /* ------------------------------------------------------------\n     3. PRISMATIC SPECTRUM — the eight emotional hues + neutrals\n     ------------------------------------------------------------ */\n  --ch-violet:  #a78bfa;\n  --ch-indigo:  #818cf8;\n  --ch-blue:    #60a5fa;\n  --ch-cyan:    #22d3ee;\n  --ch-magenta: #d946ef;\n  --ch-rose:    #fb7185;\n  --ch-gold:    #facc15;\n  --ch-amber:   #f59e0b;\n  --ch-emerald: #22c55e;\n  --ch-orange:  #f97316;\n\n  /* ------------------------------------------------------------\n     4. SEMANTIC\n     ------------------------------------------------------------ */\n  --ch-success: #22c55e;\n  --ch-warning: #facc15;\n  --ch-danger:  #ef4444;\n  --ch-info:    #22d3ee;\n\n  /* ------------------------------------------------------------\n     5. EMOTION PALETTES\n     Each provides: primary, secondary, glow, edge, shadow, ink.\n     A surface in emotion mode resolves --emo-* to its variant.\n     ------------------------------------------------------------ */\n  --emo-serenity-primary:   #60a5fa;\n  --emo-serenity-secondary: #22d3ee;\n  --emo-serenity-glow:      rgba(96, 165, 250, 0.40);\n  --emo-serenity-edge:      rgba(96, 165, 250, 0.55);\n  --emo-serenity-shadow:    rgba(96, 165, 250, 0.18);\n  --emo-serenity-ink:       #dbeafe;\n\n  --emo-passion-primary:   #ef4444;\n  --emo-passion-secondary: #ec4899;\n  --emo-passion-glow:      rgba(239, 68, 68, 0.40);\n  --emo-passion-edge:      rgba(239, 68, 68, 0.55);\n  --emo-passion-shadow:    rgba(239, 68, 68, 0.18);\n  --emo-passion-ink:       #fecaca;\n\n  --emo-joy-primary:   #facc15;\n  --emo-joy-secondary: #f59e0b;\n  --emo-joy-glow:      rgba(250, 204, 21, 0.40);\n  --emo-joy-edge:      rgba(250, 204, 21, 0.60);\n  --emo-joy-shadow:    rgba(250, 204, 21, 0.18);\n  --emo-joy-ink:       #fef3c7;\n\n  --emo-mystery-primary:   #a855f7;\n  --emo-mystery-secondary: #6366f1;\n  --emo-mystery-glow:      rgba(168, 85, 247, 0.40);\n  --emo-mystery-edge:      rgba(168, 85, 247, 0.55);\n  --emo-mystery-shadow:    rgba(168, 85, 247, 0.18);\n  --emo-mystery-ink:       #e9d5ff;\n\n  --emo-compassion-primary:   #ec4899;\n  --emo-compassion-secondary: #fb7185;\n  --emo-compassion-glow:      rgba(236, 72, 153, 0.40);\n  --emo-compassion-edge:      rgba(236, 72, 153, 0.55);\n  --emo-compassion-shadow:    rgba(236, 72, 153, 0.18);\n  --emo-compassion-ink:       #fbcfe8;\n\n  --emo-courage-primary:   #f97316;\n  --emo-courage-secondary: #fb923c;\n  --emo-courage-glow:      rgba(249, 115, 22, 0.40);\n  --emo-courage-edge:      rgba(249, 115, 22, 0.55);\n  --emo-courage-shadow:    rgba(249, 115, 22, 0.18);\n  --emo-courage-ink:       #fed7aa;\n\n  --emo-balance-primary:   #22c55e;\n  --emo-balance-secondary: #84cc16;\n  --emo-balance-glow:      rgba(34, 197, 94, 0.40);\n  --emo-balance-edge:      rgba(34, 197, 94, 0.55);\n  --emo-balance-shadow:    rgba(34, 197, 94, 0.18);\n  --emo-balance-ink:       #bbf7d0;\n\n  --emo-transcendence-primary:   #e0f2fe;\n  --emo-transcendence-secondary: #c084fc;\n  --emo-transcendence-glow:      rgba(192, 132, 252, 0.40);\n  --emo-transcendence-edge:      rgba(224, 242, 254, 0.65);\n  --emo-transcendence-shadow:    rgba(192, 132, 252, 0.18);\n  --emo-transcendence-ink:       #f0f9ff;\n\n  /* ------------------------------------------------------------\n     6. GRADIENTS\n     ------------------------------------------------------------ */\n  --ch-grad-prismatic:\n    linear-gradient(135deg, #60a5fa 0%, #22d3ee 22%, #a855f7 48%, #ec4899 70%, #f97316 88%, #facc15 100%);\n  --ch-grad-prismatic-conic:\n    conic-gradient(from 220deg at 50% 50%, #22d3ee, #60a5fa, #a78bfa, #d946ef, #fb7185, #f59e0b, #facc15, #84cc16, #22d3ee);\n  --ch-grad-cool: linear-gradient(135deg, #22d3ee 0%, #6366f1 100%);\n  --ch-grad-warm: linear-gradient(135deg, #f97316 0%, #ec4899 100%);\n  --ch-grad-primary-cta: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%);\n  --ch-grad-hero-veil:\n    radial-gradient(ellipse 80% 60% at 50% 30%, rgba(167,139,250,0.18) 0%, transparent 60%),\n    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(34,211,238,0.12) 0%, transparent 60%),\n    radial-gradient(ellipse 60% 40% at 20% 90%, rgba(217,70,239,0.10) 0%, transparent 60%);\n  --ch-grad-ground-floor:\n    linear-gradient(180deg, transparent 0%, rgba(5,8,18,0.85) 80%, #050812 100%);\n\n  /* ------------------------------------------------------------\n     7. GLASS — four tiers\n     ------------------------------------------------------------ */\n  --ch-glass-card:     rgba(18, 22, 36, 0.72);\n  --ch-glass-light:    rgba(255, 255, 255, 0.04);\n  --ch-glass-heavy:    rgba(10, 14, 26, 0.85);\n  --ch-glass-elevated: rgba(30, 40, 66, 0.55);\n  --ch-blur-sm: 8px;\n  --ch-blur-md: 16px;\n  --ch-blur-lg: 24px;\n  --ch-blur-xl: 40px;\n  --ch-saturate: 180%;\n\n  /* ------------------------------------------------------------\n     8. BORDERS\n     ------------------------------------------------------------ */\n  --ch-border-w:      1px;\n  --ch-border-soft:   rgba(255, 255, 255, 0.08);\n  --ch-border-mid:    rgba(255, 255, 255, 0.15);\n  --ch-border-strong: rgba(255, 255, 255, 0.22);\n  --ch-border-prism:  rgba(167, 139, 250, 0.28);\n\n  /* ------------------------------------------------------------\n     9. RADII\n     ------------------------------------------------------------ */\n  --ch-radius-xs:   4px;\n  --ch-radius-sm:   8px;\n  --ch-radius-md:   12px;\n  --ch-radius-lg:   16px;\n  --ch-radius-xl:   24px;\n  --ch-radius-2xl:  32px;\n  --ch-radius-full: 9999px;\n\n  /* ------------------------------------------------------------\n     10. SHADOWS & GLOWS\n     ------------------------------------------------------------ */\n  --ch-shadow-sm:   0 2px 8px rgba(0,0,0,0.25);\n  --ch-shadow-md:   0 8px 24px rgba(0,0,0,0.35);\n  --ch-shadow-lg:   0 16px 48px rgba(0,0,0,0.50);\n  --ch-shadow-card: 0 8px 32px rgba(0,0,0,0.37), inset 0 1px 0 rgba(255,255,255,0.06);\n  --ch-shadow-lift: 0 20px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10);\n  --ch-shadow-inner: inset 0 1px 0 rgba(255,255,255,0.10);\n\n  --ch-glow-ambient: 0 0 24px rgba(167, 139, 250, 0.20);\n  --ch-glow-primary: 0 0 32px rgba(167, 139, 250, 0.45);\n  --ch-glow-intense: 0 0 48px rgba(167, 139, 250, 0.65);\n  --ch-text-glow:    0 0 20px rgba(167, 139, 250, 0.45);\n\n  /* ------------------------------------------------------------\n     11. SPACING (4-based)\n     ------------------------------------------------------------ */\n  --ch-space-1:  4px;\n  --ch-space-2:  8px;\n  --ch-space-3:  12px;\n  --ch-space-4:  16px;\n  --ch-space-5:  20px;\n  --ch-space-6:  24px;\n  --ch-space-8:  32px;\n  --ch-space-10: 40px;\n  --ch-space-12: 48px;\n  --ch-space-16: 64px;\n  --ch-space-20: 80px;\n\n  /* ------------------------------------------------------------\n     12. DEPTH / Z-INDEX\n     ------------------------------------------------------------ */\n  --ch-z-1: 1;     /* inline within card     */\n  --ch-z-2: 10;    /* default card / panel   */\n  --ch-z-3: 30;    /* hero / floating prism  */\n  --ch-z-4: 100;   /* modal / overlay        */\n\n  /* ------------------------------------------------------------\n     13. TYPE\n     ------------------------------------------------------------ */\n  --ch-font-display: \"Prompt\", \"Inter\", system-ui, sans-serif;\n  --ch-font-body:    \"Prompt\", \"Inter\", system-ui, sans-serif;\n  --ch-font-mono:    \"JetBrains Mono\", ui-monospace, SFMono-Regular, monospace;\n\n  --ch-text-xs:   12px;\n  --ch-text-sm:   14px;\n  --ch-text-base: 16px;\n  --ch-text-lg:   18px;\n  --ch-text-xl:   20px;\n  --ch-text-2xl:  24px;\n  --ch-text-3xl:  30px;\n  --ch-text-4xl:  36px;\n  --ch-text-5xl:  48px;\n  --ch-text-6xl:  64px;\n\n  --ch-tracking-display: -0.03em;\n  --ch-tracking-body:    0;\n  --ch-tracking-label:   0.08em;\n\n  --ch-leading-tight:   1.1;\n  --ch-leading-snug:    1.25;\n  --ch-leading-normal:  1.5;\n  --ch-leading-relaxed: 1.7;\n\n  /* ------------------------------------------------------------\n     14. MOTION\n     ------------------------------------------------------------ */\n  --ch-dur-instant: 100ms;\n  --ch-dur-fast:    150ms;\n  --ch-dur-normal:  250ms;\n  --ch-dur-slow:    400ms;\n  --ch-dur-ritual:  800ms;\n  --ch-dur-ambient: 12000ms;\n\n  --ch-ease-linear: linear;\n  --ch-ease-out:    cubic-bezier(0.22, 1, 0.36, 1);\n  --ch-ease-in:     cubic-bezier(0.55, 0, 0.55, 0.2);\n  --ch-ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);\n  --ch-ease-ritual: cubic-bezier(0.65, 0, 0.35, 1);\n\n  /* ------------------------------------------------------------\n     15. DEFAULT EMOTION CONTEXT — overridden by [data-emotion]\n     ------------------------------------------------------------ */\n  --emo-primary:   var(--ch-violet);\n  --emo-secondary: var(--ch-blue);\n  --emo-glow:      rgba(167, 139, 250, 0.40);\n  --emo-edge:      rgba(167, 139, 250, 0.55);\n  --emo-shadow:    rgba(167, 139, 250, 0.18);\n  --emo-ink:       #ede9fe;\n}\n\n/* ------------------------------------------------------------\n   16. EMOTION CONTEXT — apply to any subtree to retune.\n   ------------------------------------------------------------ */\n[data-emotion=\"serenity\"] {\n  --emo-primary:   var(--emo-serenity-primary);\n  --emo-secondary: var(--emo-serenity-secondary);\n  --emo-glow:      var(--emo-serenity-glow);\n  --emo-edge:      var(--emo-serenity-edge);\n  --emo-shadow:    var(--emo-serenity-shadow);\n  --emo-ink:       var(--emo-serenity-ink);\n}\n[data-emotion=\"passion\"] {\n  --emo-primary:   var(--emo-passion-primary);\n  --emo-secondary: var(--emo-passion-secondary);\n  --emo-glow:      var(--emo-passion-glow);\n  --emo-edge:      var(--emo-passion-edge);\n  --emo-shadow:    var(--emo-passion-shadow);\n  --emo-ink:       var(--emo-passion-ink);\n}\n[data-emotion=\"joy\"] {\n  --emo-primary:   var(--emo-joy-primary);\n  --emo-secondary: var(--emo-joy-secondary);\n  --emo-glow:      var(--emo-joy-glow);\n  --emo-edge:      var(--emo-joy-edge);\n  --emo-shadow:    var(--emo-joy-shadow);\n  --emo-ink:       var(--emo-joy-ink);\n}\n[data-emotion=\"mystery\"] {\n  --emo-primary:   var(--emo-mystery-primary);\n  --emo-secondary: var(--emo-mystery-secondary);\n  --emo-glow:      var(--emo-mystery-glow);\n  --emo-edge:      var(--emo-mystery-edge);\n  --emo-shadow:    var(--emo-mystery-shadow);\n  --emo-ink:       var(--emo-mystery-ink);\n}\n[data-emotion=\"compassion\"] {\n  --emo-primary:   var(--emo-compassion-primary);\n  --emo-secondary: var(--emo-compassion-secondary);\n  --emo-glow:      var(--emo-compassion-glow);\n  --emo-edge:      var(--emo-compassion-edge);\n  --emo-shadow:    var(--emo-compassion-shadow);\n  --emo-ink:       var(--emo-compassion-ink);\n}\n[data-emotion=\"courage\"] {\n  --emo-primary:   var(--emo-courage-primary);\n  --emo-secondary: var(--emo-courage-secondary);\n  --emo-glow:      var(--emo-courage-glow);\n  --emo-edge:      var(--emo-courage-edge);\n  --emo-shadow:    var(--emo-courage-shadow);\n  --emo-ink:       var(--emo-courage-ink);\n}\n[data-emotion=\"balance\"] {\n  --emo-primary:   var(--emo-balance-primary);\n  --emo-secondary: var(--emo-balance-secondary);\n  --emo-glow:      var(--emo-balance-glow);\n  --emo-edge:      var(--emo-balance-edge);\n  --emo-shadow:    var(--emo-balance-shadow);\n  --emo-ink:       var(--emo-balance-ink);\n}\n[data-emotion=\"transcendence\"] {\n  --emo-primary:   var(--emo-transcendence-primary);\n  --emo-secondary: var(--emo-transcendence-secondary);\n  --emo-glow:      var(--emo-transcendence-glow);\n  --emo-edge:      var(--emo-transcendence-edge);\n  --emo-shadow:    var(--emo-transcendence-shadow);\n  --emo-ink:       var(--emo-transcendence-ink);\n}\n\n/* ------------------------------------------------------------\n   17. ACCESSIBILITY — reduced motion blanket override.\n   ------------------------------------------------------------ */\n@media (prefers-reduced-motion: reduce) {\n  :root {\n    --ch-dur-instant: 0.01ms;\n    --ch-dur-fast:    0.01ms;\n    --ch-dur-normal:  0.01ms;\n    --ch-dur-slow:    0.01ms;\n    --ch-dur-ritual:  0.01ms;\n    --ch-dur-ambient: 0.01ms;\n  }\n}\n\n/* ------------------------------------------------------------\n   18. RESET-LITE — apply opinionated baselines to <html>\n   ------------------------------------------------------------ */\nhtml, body {\n  background: var(--ch-bg-deep);\n  color: var(--ch-text-main);\n  font-family: var(--ch-font-body);\n  font-size: var(--ch-text-base);\n  line-height: var(--ch-leading-normal);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n<\u002Fstyle>\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Caveat';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"e9f0c023-0cda-4ebc-a7d0-c2bf474c0b38\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Caveat';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"8094ab7b-63c8-442e-8e73-fb22 c: url(\"0f9c6832-bb5e-4dbc-ac67-46c828e77a7e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n:root{\n  --bg: #05070f;\n  --bg-2: #0a0c1a;\n  --ink: #f8fafc;\n  --ink-2: rgba(248,250,252,0.72);\n  --ink-3: rgba(248,250,252,0.50);\n  --ink-4: rgba(248,250,252,0.32);\n\n  --hue-1: #22c55e; /* nebula     - green */\n  --hue-2: #22d3ee; /* crystal    - cyan  */\n  --hue-3: #a855f7; /* particles  - violet*/\n  --hue-4: #f472b6; /* holocards  - rose  */\n  --hue-5: #f97316; /* glow       - orange*/\n  --hue-6: #facc15; /* interactiveUI - gold*/\n\n  --pen-cyan: #67e8f9;\n  --pen-mint: #6ee7b7;\n  --pen-rose: #fb7185;\n  --pen-amber: #fcd34d;\n  --pen-violet: #c4b5fd;\n\n  --panel: rgba(10,12,26,0.74);\n  --panel-2: rgba(8,10,22,0.85);\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ch-font-display); -webkit-font-smoothing: antialiased; }\n\n/* Stage --------------------------------------------------- */\n.stage {\n  min-height: 100vh;\n  padding: 28px clamp(20px, 2.4vw, 36px) 40px;\n  background:\n    radial-gradient(ellipse 60% 50% at 20% 5%, rgba(167,139,250,0.16), transparent 60%),\n    radial-gradient(ellipse 60% 40% at 90% 90%, rgba(34,211,238,0.10), transparent 60%),\n    radial-gradient(ellipse 50% 40% at 50% 50%, rgba(217,70,239,0.06), transparent 70%),\n    var(--bg);\n  position: relative; overflow: hidden;\n}\n.stage::before{\n  content:\"\"; position: absolute; inset: 0; pointer-events: none;\n  background-image:\n    radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,0.5), transparent 50%),\n    radial-gradient(1px 1px at 78% 14%, rgba(255,255,255,0.4), transparent 50%),\n    radial-gradient(1.5px 1.5px at 88% 78%, rgba(255,255,255,0.4), transparent 50%),\n    radial-gradient(1px 1px at 22% 78%, rgba(255,255,255,0.4), transparent 50%),\n    radial-gradient(1px 1px at 44% 52%, rgba(255,255,255,0.3), transparent 50%);\n  background-size: 600px 600px, 480px 480px, 540px 540px, 520px 520px, 460px 460px;\n}\n\n.poster {\n  position: relative;\n  max-width: 1560px;\n  margin: 0 auto;\n  display: grid;\n  grid-template-columns: minmax(280px, 1fr) minmax(420px, 1.45fr) minmax(280px, 1fr);\n  grid-template-rows: auto auto auto;\n  gap: 18px;\n}\n\n/* HEADER -------------------------------------------------- */\n.poster-head {\n  grid-column: 1 / -1;\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  gap: 16px;\n  padding: 6px 6px 10px;\n  position: relative;\n}\n.poster-head h1 {\n  margin: 0;\n  text-align: center;\n  font-family: \"Caveat\", cursive;\n  font-weight: 700;\n  font-size: clamp(32px, 3.6vw, 52px);\n  letter-spacing: 0.01em;\n  line-height: 1.05;\n  background: linear-gradient(95deg, #f8fafc 0%, #c4b5fd 35%, #67e8f9 65%, #facc15 100%);\n  -webkit-background-clip: text; background-clip: text;\n  -webkit-text-fill-color: transparent;\n  text-shadow: 0 0 32px rgba(167,139,250,0.30);\n}\n.poster-head h1 small{\n  display: block;\n  font-size: 0.40em;\n  margin-top: 4px;\n  background: none;\n  -webkit-text-fill-color: var(--ink-2);\n  color: var(--ink-2);\n  font-weight: 500;\n  font-style: italic;\n  letter-spacing: 0.005em;\n}\n\n.hand-left, .hand-right {\n  display: flex; align-items: center; gap: 12px;\n  font-family: \"Caveat\", cursive;\n  color: var(--pen-cyan);\n}\n.hand-left { justify-content: flex-start; }\n.hand-right { justify-content: flex-end; color: var(--pen-amber); }\n.hand-left .scribble, .hand-right .scribble {\n  font-size: 26px; line-height: 1; transform: rotate(-6deg);\n}\n.hand-right .scribble{ transform: rotate(6deg); }\n.hand-cap {\n  width: 64px; height: 50px;\n  border-radius: 8px 8px 0 0 / 12px 12px 0 0;\n  background: linear-gradient(180deg, #0b1a2f 0%, #1e3a8a 100%);\n  position: relative;\n  box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12);\n}\n.hand-cap::before, .hand-cap::after { content:\"\"; position:absolute; }\n.hand-cap::before {\n  /* mortar board top */\n  inset: -10px -16px auto -16px;\n  height: 12px;\n  background: #0b1a2f;\n  transform: skewX(-22deg);\n  border-radius: 2px;\n}\n.hand-cap::after {\n  /* tassel */\n  right: 8px; top: -2px;\n  width: 2px; height: 22px;\n  background: var(--pen-amber);\n  box-shadow: 0 22px 0 -2px var(--pen-amber);\n}\n.hand-star {\n  width: 32px; height: 32px;\n  display: grid; place-items: center;\n  color: var(--pen-amber);\n  filter: drop-shadow(0 0 6px rgba(250,204,21,0.6));\n}\n.hand-star svg{ width: 100%; height: 100%; }\n.scribble-arrow {\n  font-family: \"Caveat\", cursive;\n  font-size: 18px;\n  color: var(--pen-cyan);\n  transform: rotate(-3deg);\n  display: inline-flex; align-items: center; gap: 4px;\n}\n\n/* PANELS -------------------------------------------------- */\n.panel {\n  position: relative;\n  border-radius: 14px;\n  border: 1px solid var(--panel-border, rgba(167,139,250,0.32));\n  background: var(--panel);\n  padding: 14px 16px 16px;\n  box-shadow: 0 8px 28px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);\n}\n.panel + .panel { margin-top: 14px; }\n.panel__head {\n  display: flex; align-items: center; gap: 10px;\n  margin-bottom: 12px;\n}\n.panel__num {\n  width: 22px; height: 22px; border-radius: 50%;\n  display: grid; place-items: center;\n  font-size: 11.5px; font-weight: 700;\n  color: var(--ink);\n  background: var(--num-bg, var(--hue-3));\n  box-shadow: 0 0 10px var(--num-bg, var(--hue-3));\n  flex: none;\n}\n.panel__title {\n  font-size: 13px; font-weight: 700;\n  letter-spacing: 0.06em; text-transform: uppercase;\n  color: var(--ink);\n}\n.panel__sub {\n  font-family: var(--ch-font-body);\n  font-weight: 400;\n  color: var(--ink-3);\n  letter-spacing: 0.02em;\n  text-transform: none;\n  margin-left: 4px;\n  font-size: 11px;\n}\n.panel__lede {\n  margin: 0 0 12px;\n  font-family: var(--ch-font-body);\n  font-size: 12px; line-height: 1.5;\n  color: var(--ink-2);\n  text-wrap: pretty;\n}\n\n/* Section accent colors */\n.panel.acc-1 { --panel-border: rgba(34,197,94,0.42); --num-bg: var(--hue-1); }\n.panel.acc-2 { --panel-border: rgba(34,211,238,0.42); --num-bg: var(--hue-2); }\n.panel.acc-3 { --panel-border: rgba(168,85,247,0.42); --num-bg: var(--hue-3); }\n.panel.acc-4 { --panel-border: rgba(244,114,182,0.42); --num-bg: var(--hue-4); }\n.panel.acc-5 { --panel-border: rgba(96,165,250,0.42); --num-bg: #60a5fa; }\n.panel.acc-6 { --panel-border: rgba(244,114,182,0.42); --num-bg: var(--hue-4); }\n.panel.acc-7 { --panel-border: rgba(167,139,250,0.42); --num-bg: #a78bfa; }\n.panel.acc-8 { --panel-border: rgba(192,132,252,0.42); --num-bg: #c084fc; }\n.panel.acc-9 { --panel-border: rgba(252,211,77,0.42); --num-bg: var(--hue-5); }\n.panel.acc-10 { --panel-border: rgba(96,165,250,0.42); --num-bg: #60a5fa; }\n\n/* LEFT COL ------------------------------------------------ */\n.col-left  { grid-column: 1; }\n.col-center{ grid-column: 2; }\n.col-right { grid-column: 3; }\n\n/* Stack list  -------------------------------------------- */\n.stack-list {\n  display: flex; flex-direction: column; gap: 6px;\n  font-family: var(--ch-font-body);\n  font-size: 12.5px;\n}\n.stack-row {\n  display: grid;\n  grid-template-columns: 22px 1fr auto 1fr;\n  align-items: center;\n  gap: 8px;\n}\n.stack-dot {\n  width: 20px; height: 20px; border-radius: 50%;\n  display: grid; place-items: center;\n  font-size: 11px; font-weight: 700; color: #06121a;\n}\n.stack-key { color: var(--ink); font-weight: 500; }\n.stack-key code { font-family: var(--ch-font-mono); color: var(--ink-2); font-size: 11.5px; }\n.stack-arrow { color: var(--pen-mint); font-family: \"Caveat\", cursive; font-size: 16px; }\n.stack-val { color: var(--ink-3); }\n\n.stack-row:nth-child(1) .stack-dot { background: #6ee7b7; }\n.stack-row:nth-child(2) .stack-dot { background: #67e8f9; }\n.stack-row:nth-child(3) .stack-dot { background: #c4b5fd; }\n.stack-row:nth-child(4) .stack-dot { background: #fb7185; }\n.stack-row:nth-child(5) .stack-dot { background: #fcd34d; }\n.stack-row:nth-child(6) .stack-dot { background: #f9a8d4; }\n.stack-row:nth-child(7) .stack-dot { background: #93c5fd; }\n.stack-row:nth-child(8) .stack-dot { background: #c084fc; }\n\n/* Code block --------------------------------------------- */\n.code {\n  position: relative;\n  background: rgba(5,7,15,0.85);\n  border: 1px dashed rgba(110,231,183,0.30);\n  border-radius: 8px;\n  padding: 10px 12px;\n  font-family: var(--ch-font-mono);\n  font-size: 11.5px; line-height: 1.55;\n  color: rgba(220,242,255,0.85);\n  overflow: hidden;\n}\n.code pre { margin: 0; white-space: pre; }\n.tk-tag   { color: #f9a8d4; }\n.tk-attr  { color: #67e8f9; }\n.tk-str   { color: #fcd34d; }\n.tk-key   { color: #c4b5fd; }\n.tk-val   { color: #fcd34d; }\n.tk-fn    { color: #67e8f9; }\n.tk-com   { color: rgba(255,255,255,0.30); font-style: italic; }\n.tk-num   { color: #f472b6; }\n\n.aside-handwriting {\n  font-family: \"Caveat\", cursive;\n  font-size: 16px;\n  color: var(--pen-mint);\n  display: flex; align-items: center; gap: 6px;\n  margin-top: 8px;\n  line-height: 1.05;\n}\n.aside-handwriting.amber { color: var(--pen-amber); }\n.aside-handwriting.rose  { color: var(--pen-rose); }\n.aside-handwriting.cyan  { color: var(--pen-cyan); }\n.aside-handwriting svg{ width: 22px; height: 14px; }\n\n/* CSS pillar row (Colors / Spacing / Layout / Lighting / Effects / Animations) */\n.pillars {\n  display: grid; grid-template-columns: repeat(6, 1fr);\n  gap: 6px;\n  margin-top: 6px;\n}\n.pillar {\n  border: 1px solid rgba(103,232,249,0.30);\n  background: rgba(8,12,26,0.65);\n  border-radius: 8px;\n  padding: 8px 4px 6px;\n  display: flex; flex-direction: column; align-items: center; gap: 5px;\n  color: var(--ink-2);\n}\n.pillar svg{ width: 22px; height: 22px; color: var(--pen-cyan); }\n.pillar small{\n  font-family: var(--ch-font-body); font-size: 10px;\n  letter-spacing: 0.04em;\n  color: var(--ink);\n}\n\n/* CENTER: 6-LAYER CINEMATIC SYSTEM ------------------------ */\n.cinema {\n  position: relative;\n  border: 1px solid rgba(167,139,250,0.36);\n  background: var(--panel);\n  border-radius: 16px;\n  padding: 14px 16px 16px;\n  box-shadow: 0 14px 50px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);\n}\n.cinema__head {\n  display: flex; align-items: baseline; gap: 10px;\n  margin-bottom: 12px;\n}\n.cinema__head h2 {\n  margin: 0;\n  font-size: 16px; font-weight: 700;\n  letter-spacing: 0.06em; text-transform: uppercase;\n  color: var(--pen-amber);\n}\n.cinema__head em {\n  font-style: normal; color: var(--ink-3); font-weight: 500;\n  letter-spacing: 0.02em; text-transform: none;\n  font-family: var(--ch-font-body); font-size: 11.5px;\n}\n\n.layers {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n.layer {\n  position: relative;\n  display: grid;\n  grid-template-columns: 40px 200px 1fr;\n  gap: 12px;\n  align-items: center;\n}\n.layer__circle {\n  width: 32px; height: 32px;\n  border-radius: 50%;\n  display: grid; place-items: center;\n  font-family: var(--ch-font-display);\n  font-weight: 700; font-size: 14px;\n  color: #06121a;\n  box-shadow: 0 0 14px var(--bg-c, var(--hue-3));\n  background: var(--bg-c, var(--hue-3));\n}\n.layer__copy h3 {\n  margin: 0;\n  font-size: 12.5px; font-weight: 700;\n  letter-spacing: 0.07em; text-transform: uppercase;\n  color: var(--ink);\n}\n.layer__copy p {\n  margin: 2px 0 0;\n  font-size: 11px; line-height: 1.45;\n  color: var(--ink-3);\n  font-family: var(--ch-font-body);\n}\n.layer__art {\n  position: relative;\n  height: 76px;\n  border-radius: 10px;\n  overflow: hidden;\n  background: #06080f;\n  border: 1px solid rgba(255,255,255,0.06);\n}\n.layer__arrow {\n  position: absolute;\n  left: 235px;\n  top: 50%;\n  transform: translateY(-50%);\n  color: var(--pen-cyan);\n  font-family: \"Caveat\", cursive;\n  font-size: 22px;\n  line-height: 1;\n  pointer-events: none;\n}\n\n/* Layer 1 — Nebula Background */\n.lay-nebula {\n  background:\n    radial-gradient(ellipse 60% 80% at 35% 50%, rgba(217,70,239,0.55), transparent 65%),\n    radial-gradient(ellipse 50% 70% at 75% 60%, rgba(96,165,250,0.50), transparent 65%),\n    radial-gradient(ellipse 40% 50% at 20% 30%, rgba(167,139,250,0.45), transparent 65%),\n    #06080f;\n}\n.lay-nebula::after {\n  content:\"\"; position: absolute; inset: 0;\n  background-image:\n    radial-gradient(1px 1px at 18% 22%, #fff, transparent 50%),\n    radial-gradient(1px 1px at 78% 60%, #fff, transparent 50%),\n    radial-gradient(1px 1px at 50% 80%, #fff, transparent 50%),\n    radial-gradient(1px 1px at 32% 70%, #fde68a, transparent 50%);\n  background-size: 100% 100%;\n}\n\n/* Layer 2 — Crystal Structures */\n.lay-crystal { background: #050811; }\n.lay-crystal::after {\n  content:\"\"; position: absolute; inset: 0;\n  background-image:\n    radial-gradient(ellipse 70% 90% at 50% 60%, rgba(96,165,250,0.20), transparent 70%);\n}\n.lay-crystal svg{ position: relative; z-index: 1; width: 100%; height: 100%; }\n\n/* Layer 3 — Particle Field */\n.lay-particles { background: #04060d; }\n.lay-particles::after {\n  content:\"\"; position: absolute; inset: 0;\n  background-image:\n    radial-gradient(1px 1px at 10% 30%, #67e8f9, transparent 50%),\n    radial-gradient(1.5px 1.5px at 22% 60%, #fde68a, transparent 50%),\n    radial-gradient(1px 1px at 36% 22%, #c4b5fd, transparent 50%),\n    radial-gradient(1px 1px at 44% 75%, #fb7185, transparent 50%),\n    radial-gradient(1px 1px at 56% 40%, #67e8f9, transparent 50%),\n    radial-gradient(1.5px 1.5px at 68% 65%, #fff, transparent 50%),\n    radial-gradient(1px 1px at 76% 30%, #c4b5fd, transparent 50%),\n    radial-gradient(1px 1px at 86% 55%, #fde68a, transparent 50%),\n    radial-gradient(1.2px 1.2px at 92% 75%, #67e8f9, transparent 50%),\n    radial-gradient(1px 1px at 14% 85%, #fff, transparent 50%);\n}\n\n/* Layer 4 — Holographic Cards */\n.lay-holo { background: #06080f; padding: 4px; display: flex; align-items:center; gap: 4px; }\n.lay-holo .h-card {\n  flex: 1; height: 64px; border-radius: 6px;\n  background: rgba(8,10,24,0.65);\n  position: relative;\n  border: 1px solid;\n  padding: 5px 6px;\n  display: flex; flex-direction: column; gap: 3px;\n  overflow: hidden;\n}\n.lay-holo .h-card::before{\n  content:\"\"; position:absolute; inset: -1px; border-radius:7px; pointer-events:none;\n  background: var(--hc-frame);\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor; mask-composite: exclude;\n  padding: 1px;\n}\n.lay-holo .h-card .av {\n  width: 16px; height: 16px; border-radius: 3px;\n  background: linear-gradient(135deg, var(--hc-a, #a78bfa), var(--hc-b, #67e8f9));\n}\n.lay-holo .h-card .ln { display:block; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.45); width: 80%;}\n.lay-holo .h-card .ln.s { width: 50%; opacity: 0.6;}\n.lay-holo .h-card .glow {\n  position: absolute; inset: -5px; border-radius: 10px;\n  background: radial-gradient(circle, var(--hc-glow), transparent 70%);\n  filter: blur(4px);\n  z-index: -1;\n}\n\n/* Layer 5 — Glow Overlays */\n.lay-glow {\n  background:\n    radial-gradient(circle at 18% 60%, rgba(167,139,250,0.6), transparent 50%),\n    radial-gradient(circle at 38% 35%, rgba(103,232,249,0.55), transparent 50%),\n    radial-gradient(circle at 60% 65%, rgba(244,114,182,0.55), transparent 50%),\n    radial-gradient(circle at 78% 40%, rgba(252,211,77,0.55), transparent 50%),\n    radial-gradient(circle at 92% 70%, rgba(110,231,183,0.55), transparent 50%),\n    #060a16;\n  filter: saturate(120%);\n}\n\n/* Layer 6 — Interactive UI mini */\n.lay-ui {\n  background: #060a16;\n  padding: 6px;\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 4px;\n}\n.ui-mini-top {\n  display:flex; align-items:center; gap: 8px;\n  font-family: var(--ch-font-body); font-size: 8px; color: var(--ink-2);\n}\n.ui-mini-top .brand{\n  display: flex; align-items: center; gap: 4px;\n  color: var(--ink);\n  font-weight: 600;\n}\n.ui-mini-top .brand i{\n  width:8px; height:8px; border-radius:2px;\n  background: linear-gradient(135deg, #67e8f9, #a78bfa);\n}\n.ui-mini-top .links { display:flex; gap: 6px; }\n.ui-mini-top .links span { color: var(--ink-3); }\n.ui-mini-top .links span.is-active{ color: var(--ink); border-bottom: 1px solid var(--pen-cyan); }\n.ui-mini-top .cta {\n  margin-left:auto;\n  background: linear-gradient(135deg, #a78bfa, #6366f1);\n  color: #fff;\n  padding: 2px 6px; border-radius: 4px;\n  font-size: 7.5px; font-weight: 600;\n  box-shadow: 0 0 8px rgba(167,139,250,0.6);\n}\n.ui-mini-body {\n  display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px;\n  flex: 1; align-items: center;\n  padding: 0 6px;\n}\n.ui-mini-headline {\n  font-size: 11px; font-weight: 700;\n  color: var(--ink);\n  line-height: 1.1;\n  text-shadow: 0 0 8px rgba(167,139,250,0.5);\n}\n.ui-mini-headline small {\n  display:block; font-size: 7px; font-weight: 400;\n  color: var(--ink-3); margin-top:2px;\n}\n.ui-mini-headline .pill {\n  display:inline-block;\n  background: linear-gradient(135deg, #a78bfa, #6366f1);\n  font-size: 7px; padding: 2px 6px;\n  border-radius: 999px; color: #fff;\n  margin-top: 3px;\n  box-shadow: 0 0 8px rgba(167,139,250,0.55);\n}\n.ui-mini-cube {\n  width: 56px; height: 56px;\n  margin-left: auto;\n  position: relative;\n  background: linear-gradient(135deg, rgba(167,139,250,0.35), rgba(103,232,249,0.35));\n  border: 1px solid var(--pen-cyan);\n  box-shadow: 0 0 14px rgba(103,232,249,0.55), inset 0 0 12px rgba(103,232,249,0.25);\n  transform: rotate(8deg);\n}\n.ui-mini-cube::before, .ui-mini-cube::after{\n  content:\"\"; position:absolute;\n  background: rgba(255,255,255,0.18);\n}\n.ui-mini-cube::before{\n  inset: 4px 6px auto auto; width: 8px; height: 8px;\n  background: var(--pen-cyan); border-radius:50%;\n  box-shadow: 0 0 8px var(--pen-cyan);\n}\n\n/* RIGHT COL ----------------------------------------------- */\n.comp-grid {\n  display: grid; grid-template-columns: repeat(5, 1fr);\n  gap: 8px;\n}\n.comp {\n  aspect-ratio: 1.0 / 1;\n  border-radius: 10px;\n  border: 1px solid rgba(96,165,250,0.35);\n  background: rgba(7,10,24,0.8);\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  gap: 4px;\n  padding: 4px;\n  color: var(--ink-2);\n  position: relative;\n}\n.comp svg{ width: 28px; height: 28px; color: var(--pen-cyan); }\n.comp small{\n  font-family: var(--ch-font-body);\n  font-size: 10px;\n  letter-spacing: 0.04em;\n  color: var(--ink);\n}\n\n/* Motion list */\n.motion-grid {\n  display: grid; grid-template-columns: repeat(6, 1fr);\n  gap: 6px;\n  margin-bottom: 10px;\n}\n.motion {\n  display: flex; flex-direction: column; align-items: center; gap: 4px;\n  padding: 6px 2px;\n  border-radius: 8px;\n  border: 1px dashed rgba(244,114,182,0.30);\n  background: rgba(20,8,18,0.55);\n  color: var(--ink-2);\n}\n.motion svg { width: 28px; height: 22px; color: var(--pen-rose); }\n.motion small{ font-family: var(--ch-font-body); font-size: 9.5px; color: var(--ink); }\n\n/* Asset row */\n.asset-row {\n  display: grid; grid-template-columns: repeat(6, 1fr);\n  gap: 6px;\n}\n.asset {\n  aspect-ratio: 1.0 / 1;\n  border-radius: 8px;\n  border: 1px solid rgba(167,139,250,0.30);\n  background: rgba(8,10,22,0.75);\n  position: relative;\n  overflow: hidden;\n  display: flex; align-items: flex-end;\n  padding: 3px;\n}\n.asset__art { position:absolute; inset: 0; }\n.asset__lbl {\n  position: relative;\n  font-family: var(--ch-font-body);\n  font-size: 9px;\n  background: rgba(0,0,0,0.55);\n  color: var(--ink);\n  padding: 2px 4px;\n  border-radius: 3px;\n  letter-spacing: 0.02em;\n}\n.asset.nebula .asset__art {\n  background:\n    radial-gradient(ellipse 60% 80% at 35% 50%, rgba(217,70,239,0.6), transparent 65%),\n    radial-gradient(ellipse 50% 70% at 75% 60%, rgba(96,165,250,0.55), transparent 65%),\n    #06080f;\n}\n.asset.crystals .asset__art{\n  background: linear-gradient(180deg, #06080f, #0a1228);\n}\n.asset.particles .asset__art{\n  background: #04060d;\n}\n.asset.particles .asset__art::after{\n  content:\"\"; position:absolute; inset:0;\n  background-image:\n    radial-gradient(1px 1px at 30% 30%, #fff, transparent 50%),\n    radial-gradient(1px 1px at 60% 70%, #67e8f9, transparent 50%),\n    radial-gradient(1px 1px at 80% 30%, #fde68a, transparent 50%),\n    radial-gradient(1px 1px at 18% 78%, #c4b5fd, transparent 50%);\n}\n.asset.overlays .asset__art{\n  background:\n    radial-gradient(circle at 30% 40%, rgba(167,139,250,0.7), transparent 60%),\n    radial-gradient(circle at 70% 60%, rgba(252,211,77,0.5), transparent 60%),\n    #06080f;\n}\n.asset.cards .asset__art{\n  background: linear-gradient(135deg, rgba(167,139,250,0.3), rgba(103,232,249,0.3)), #08101e;\n}\n.asset.icons .asset__art{\n  background: #06080f;\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  grid-template-rows: repeat(3, 1fr);\n  gap: 2px;\n  padding: 6px;\n}\n.asset.icons .asset__art i{\n  background: rgba(167,139,250,0.18);\n  border: 1px solid rgba(167,139,250,0.45);\n  border-radius: 2px;\n}\n\n/* Tools row */\n.tools {\n  display: grid; grid-template-columns: repeat(6, 1fr);\n  gap: 8px;\n}\n.tool {\n  aspect-ratio: 1 / 1;\n  border-radius: 10px;\n  background: rgba(7,10,24,0.85);\n  border: 1px solid rgba(192,132,252,0.32);\n  display:flex; flex-direction:column; align-items:center; justify-content:center;\n  gap: 4px;\n  padding: 4px;\n  color: var(--ink-2);\n}\n.tool svg{ width: 26px; height: 26px;}\n.tool small{ font-family: var(--ch-font-body); font-size: 9.5px; color: var(--ink); }\n.tool.html5 svg{ color: #ef4444; }\n.tool.css3  svg{ color: #3b82f6; }\n.tool.tw    svg{ color: #22d3ee; }\n.tool.react svg{ color: #67e8f9; }\n.tool.anot  svg{ color: #a78bfa; }\n.tool.anim  svg{ color: #22c55e; }\n\n/* BOTTOM ROW --------------------------------------------- */\n.bottom-row {\n  grid-column: 1 / -1; grid-row: 3;\n  display: grid;\n  grid-template-columns: 1.6fr 1fr;\n  gap: 18px;\n}\n.flow {\n  display: grid;\n  grid-template-columns: repeat(6, 1fr);\n  gap: 8px;\n  margin-top: 4px;\n  align-items: stretch;\n}\n.flow-step {\n  position: relative;\n  padding: 12px 8px 10px;\n  border-radius: 10px;\n  background: rgba(8,10,22,0.75);\n  border: 1px solid rgba(252,211,77,0.28);\n  display: flex; flex-direction: column; align-items: center; gap: 6px;\n  text-align: center;\n}\n.flow-step::after {\n  content: \"→\";\n  position: absolute;\n  right: -14px;\n  top: 50%;\n  transform: translateY(-50%);\n  color: var(--pen-amber);\n  font-family: \"Caveat\", cursive;\n  font-size: 26px;\n  z-index: 2;\n}\n.flow-step:last-child::after { display: none; }\n.flow-step .ic {\n  width: 42px; height: 42px;\n  border-radius: 10px;\n  display: grid; place-items: center;\n  background: rgba(252,211,77,0.10);\n  border: 1px solid rgba(252,211,77,0.35);\n  color: var(--pen-amber);\n  margin-bottom: 4px;\n}\n.flow-step .ic svg{ width: 22px; height: 22px; }\n.flow-step b {\n  font-size: 11px; font-weight: 700;\n  color: var(--ink);\n  letter-spacing: 0.02em;\n  font-family: var(--ch-font-display);\n}\n.flow-step span {\n  font-size: 10px; color: var(--ink-3);\n  font-family: var(--ch-font-body);\n  line-height: 1.35;\n}\n/* alternate colors per step */\n.flow-step:nth-child(1) .ic { color: #67e8f9; background: rgba(34,211,238,0.10); border-color: rgba(34,211,238,0.35); }\n.flow-step:nth-child(2) .ic { color: #c4b5fd; background: rgba(167,139,250,0.10); border-color: rgba(167,139,250,0.35); }\n.flow-step:nth-child(3) .ic { color: #facc15; background: rgba(252,204,21,0.10); border-color: rgba(252,204,21,0.35); }\n.flow-step:nth-child(4) .ic { color: #67e8f9; background: rgba(103,232,249,0.10); border-color: rgba(103,232,249,0.35); }\n.flow-step:nth-child(5) .ic { color: #fb7185; background: rgba(251,113,133,0.10); border-color: rgba(251,113,133,0.35); }\n.flow-step:nth-child(6) .ic { color: #6ee7b7; background: rgba(110,231,183,0.10); border-color: rgba(110,231,183,0.35); }\n\n/* Big idea */\n.big {\n  display: grid;\n  grid-template-columns: 1fr 200px;\n  gap: 14px;\n}\n.big__lede {\n  font-family: var(--ch-font-body);\n  font-size: 13px; line-height: 1.55;\n  color: var(--ink-2);\n}\n.big__lede p { margin: 0 0 8px; }\n.big__lede strong {\n  color: var(--ink);\n  text-shadow: 0 0 14px rgba(103,232,249,0.5);\n  font-weight: 600;\n  background: linear-gradient(95deg, #67e8f9 0%, #c4b5fd 60%, #fcd34d 100%);\n  -webkit-background-clip: text; background-clip: text;\n  -webkit-text-fill-color: transparent;\n}\n.big__lede .signoff {\n  font-family: \"Caveat\", cursive;\n  font-size: 18px;\n  color: var(--pen-mint);\n  display: block;\n  margin-top: 6px;\n}\n\n.remember {\n  background: rgba(7,10,24,0.85);\n  border: 1px dashed rgba(252,211,77,0.40);\n  border-radius: 10px;\n  padding: 10px 12px;\n  display: flex; flex-direction: column; gap: 4px;\n  font-family: var(--ch-font-body);\n}\n.remember h5 {\n  margin: 0 0 6px;\n  font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--pen-amber);\n  font-family: var(--ch-font-display);\n  font-weight: 700;\n}\n.remember ul { list-style: none; margin: 0; padding: 0; display:flex; flex-direction:column; gap: 4px; }\n.remember li { display:flex; align-items:center; justify-content: space-between; font-size: 11.5px; color: var(--ink); }\n.remember li::after{ content:\"✓\"; color: var(--pen-mint); font-weight: 700; font-family: var(--ch-font-mono); }\n\n.aside-note {\n  position: absolute;\n  font-family: \"Caveat\", cursive;\n  font-size: 16px;\n  color: var(--pen-mint);\n  line-height: 1.1;\n  text-align: center;\n  max-width: 130px;\n}\n\n/* Generic responsive collapse */\n@media (max-width: 1280px) {\n  .poster { grid-template-columns: 1fr 1fr; }\n  .col-left  { grid-column: 1; grid-row: 1; }\n  .col-center{ grid-column: 1 / -1; grid-row: 2; }\n  .col-right { grid-column: 2; grid-row: 1; }\n  .bottom-row { grid-row: 3; grid-template-columns: 1fr; }\n  .layer { grid-template-columns: 40px 180px 1fr; }\n}\n@media (max-width: 760px) {\n  .poster { grid-template-columns: 1fr; }\n  .col-left, .col-right { grid-column: 1; }\n  .col-right { grid-row: 3; }\n  .col-center { grid-row: 2; }\n  .bottom-row { grid-row: 4; }\n  .pillars, .motion-grid, .asset-row, .tools, .comp-grid { grid-template-columns: repeat(3, 1fr); }\n  .flow { grid-template-columns: repeat(2, 1fr); }\n  .flow-step::after { display: none; }\n  .layer { grid-template-columns: 36px 1fr; }\n  .layer__art { grid-column: 1 / -1; }\n  .poster-head { grid-template-columns: 1fr; }\n  .hand-left, .hand-right { justify-content: center; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<main class=\"stage\">\n  <div class=\"poster\">\n\n    <!-- ============================== HEADER -->\n    <header class=\"poster-head\">\n      <div class=\"hand-left\">\n        <div class=\"hand-cap\" aria-hidden=\"true\"><\u002Fdiv>\n        <div class=\"scribble\">Let's<br>Learn!<\u002Fdiv>\n      <\u002Fdiv>\n      <h1>\n        Front-End &amp; CSS Library — Everything Explained\n        <small>Think of the browser as a movie screen. We build the world, the actors, the lighting, and the story.<\u002Fsmall>\n      <\u002Fh1>\n      <div class=\"hand-right\">\n        <div class=\"scribble\">You're<br>Building a<br>Universe!<\u002Fdiv>\n        <div class=\"hand-star\" aria-hidden=\"true\">\n          <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><polygon points=\"12,2 14.6,9.3 22,9.8 16.2,14.2 17.7,21.8 12,17.7 6.3,21.8 7.8,14.2 2,9.8 9.4,9.3\"><\u002Fpolygon><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- ============================== LEFT COLUMN -->\n    <div class=\"col-left\">\n\n      <!-- 1 STACK -->\n      <section class=\"panel acc-2\">\n        <header class=\"panel__head\">\n          <span class=\"panel__num\">1<\u002Fspan>\n          <div class=\"panel__title\">The Front-End Stack <span class=\"panel__sub\">(the big picture)<\u002Fspan><\u002Fdiv>\n        <\u002Fheader>\n        <p class=\"panel__lede\">All these pieces work together to create what you see and interact with in the browser.<\u002Fp>\n        <div class=\"stack-list\">\n          <div class=\"stack-row\"><span class=\"stack-dot\">1<\u002Fspan><span class=\"stack-key\">Structure <code>(HTML)<\u002Fcode><\u002Fspan><span class=\"stack-arrow\">→<\u002Fspan><span class=\"stack-val\">What exists on the page<\u002Fspan><\u002Fdiv>\n          <div class=\"stack-row\"><span class=\"stack-dot\">2<\u002Fspan><span class=\"stack-key\">Style <code>(CSS)<\u002Fcode><\u002Fspan><span class=\"stack-arrow\">→<\u002Fspan><span class=\"stack-val\">How it looks<\u002Fspan><\u002Fdiv>\n          <div class=\"stack-row\"><span class=\"stack-dot\">3<\u002Fspan><span class=\"stack-key\">State <code>(JS / React)<\u002Fcode><\u002Fspan><span class=\"stack-arrow\">→<\u002Fspan><span class=\"stack-val\">How it behaves<\u002Fspan><\u002Fdiv>\n          <div class=\"stack-row\"><span class=\"stack-dot\">4<\u002Fspan><span class=\"stack-key\">Motion <code>(Animations)<\u002Fcode><\u002Fspan><span class=\"stack-arrow\">→<\u002Fspan><span class=\"stack-val\">How it moves<\u002Fspan><\u002Fdiv>\n          <div class=\"stack-row\"><span class=\"stack-dot\">5<\u002Fspan><span class=\"stack-key\">Assets <code>(Image / SVG / Video)<\u002Fcode><\u002Fspan><span class=\"stack-arrow\">→<\u002Fspan><span class=\"stack-val\">The visual materials<\u002Fspan><\u002Fdiv>\n          <div class=\"stack-row\"><span class=\"stack-dot\">6<\u002Fspan><span class=\"stack-key\">Design System <code>(Tokens)<\u002Fcode><\u002Fspan><span class=\"stack-arrow\">→<\u002Fspan><span class=\"stack-val\">The visual rules<\u002Fspan><\u002Fdiv>\n          <div class=\"stack-row\"><span class=\"stack-dot\">7<\u002Fspan><span class=\"stack-key\">Components<\u002Fspan><span class=\"stack-arrow\">→<\u002Fspan><span class=\"stack-val\">Reusable UI building blocks<\u002Fspan><\u002Fdiv>\n          <div class=\"stack-row\"><span class=\"stack-dot\">8<\u002Fspan><span class=\"stack-key\">Runtime <code>(Browser)<\u002Fcode><\u002Fspan><span class=\"stack-arrow\">→<\u002Fspan><span class=\"stack-val\">Where it all runs<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 2 HTML -->\n      <section class=\"panel acc-1\">\n        <header class=\"panel__head\">\n          <span class=\"panel__num\">2<\u002Fspan>\n          <div class=\"panel__title\">HTML / Structure Layer<\u002Fdiv>\n        <\u002Fheader>\n        <p class=\"panel__lede\">This is the skeleton. It defines the layout and elements on the page.<\u002Fp>\n        <div class=\"code\">\n<pre><span class=\"tk-tag\">&lt;section<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"hero\"<\u002Fspan><span class=\"tk-tag\">&gt;<\u002Fspan>\n  <span class=\"tk-tag\">&lt;div<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"nebula-bg\"<\u002Fspan><span class=\"tk-tag\">&gt;&lt;/div&gt;<\u002Fspan>\n  <span class=\"tk-tag\">&lt;div<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"crystal-layer\"<\u002Fspan><span class=\"tk-tag\">&gt;&lt;/div&gt;<\u002Fspan>\n  <span class=\"tk-tag\">&lt;div<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"particle-field\"<\u002Fspan><span class=\"tk-tag\">&gt;&lt;/div&gt;<\u002Fspan>\n  <span class=\"tk-tag\">&lt;div<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"holo-cards\"<\u002Fspan><span class=\"tk-tag\">&gt;&lt;/div&gt;<\u002Fspan>\n  <span class=\"tk-tag\">&lt;div<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"glow-overlay\"<\u002Fspan><span class=\"tk-tag\">&gt;&lt;/div&gt;<\u002Fspan>\n  <span class=\"tk-tag\">&lt;div<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"ui-layer\"<\u002Fspan><span class=\"tk-tag\">&gt;<\u002Fspan>\n    <span class=\"tk-tag\">&lt;nav<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"navbar\"<\u002Fspan><span class=\"tk-tag\">&gt;&lt;/nav&gt;<\u002Fspan>\n    <span class=\"tk-tag\">&lt;div<\u002Fspan> <span class=\"tk-attr\">class<\u002Fspan>=<span class=\"tk-str\">\"hero-content\"<\u002Fspan><span class=\"tk-tag\">&gt;&lt;/div&gt;<\u002Fspan>\n  <span class=\"tk-tag\">&lt;/div&gt;<\u002Fspan>\n<span class=\"tk-tag\">&lt;/section&gt;<\u002Fspan><\u002Fpre>\n        <\u002Fdiv>\n        <div class=\"aside-handwriting\">\n          <svg viewBox=\"0 0 40 20\" fill=\"none\"><path d=\"M2 18 Q 20 2 38 12\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><polyline points=\"34,8 38,12 34,16\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\"><\u002Fpolyline><\u002Fsvg>\n          Every element has a purpose.\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 3 CSS -->\n      <section class=\"panel acc-2\">\n        <header class=\"panel__head\">\n          <span class=\"panel__num\">3<\u002Fspan>\n          <div class=\"panel__title\">CSS / Visual Layer<\u002Fdiv>\n        <\u002Fheader>\n        <p class=\"panel__lede\">CSS makes everything beautiful. It controls:<\u002Fp>\n        <div class=\"pillars\">\n          <div class=\"pillar\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"9\" cy=\"9\" r=\"2\" fill=\"#f472b6\" stroke=\"none\"><\u002Fcircle><circle cx=\"15\" cy=\"9\" r=\"2\" fill=\"#facc15\" stroke=\"none\"><\u002Fcircle><circle cx=\"9\" cy=\"15\" r=\"2\" fill=\"#22d3ee\" stroke=\"none\"><\u002Fcircle><circle cx=\"15\" cy=\"15\" r=\"2\" fill=\"#a78bfa\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n            <small>Colors<\u002Fsmall>\n          <\u002Fdiv>\n          <div class=\"pillar\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M4 6 H20 M4 12 H14 M4 18 H8\"><\u002Fpath><\u002Fsvg>\n            <small>Spacing<\u002Fsmall>\n          <\u002Fdiv>\n          <div class=\"pillar\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"3\" y=\"3\" width=\"8\" height=\"8\" rx=\"1\"><\u002Frect><rect x=\"13\" y=\"3\" width=\"8\" height=\"8\" rx=\"1\"><\u002Frect><rect x=\"3\" y=\"13\" width=\"8\" height=\"8\" rx=\"1\"><\u002Frect><rect x=\"13\" y=\"13\" width=\"8\" height=\"8\" rx=\"1\"><\u002Frect><\u002Fsvg>\n            <small>Layout<\u002Fsmall>\n          <\u002Fdiv>\n          <div class=\"pillar\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><circle cx=\"12\" cy=\"12\" r=\"4\" fill=\"#facc15\" stroke=\"none\"><\u002Fcircle><g stroke=\"#facc15\"><line x1=\"12\" y1=\"3\" x2=\"12\" y2=\"6\"><\u002Fline><line x1=\"12\" y1=\"18\" x2=\"12\" y2=\"21\"><\u002Fline><line x1=\"3\" y1=\"12\" x2=\"6\" y2=\"12\"><\u002Fline><line x1=\"18\" y1=\"12\" x2=\"21\" y2=\"12\"><\u002Fline><line x1=\"5.6\" y1=\"5.6\" x2=\"7.7\" y2=\"7.7\"><\u002Fline><line x1=\"16.3\" y1=\"16.3\" x2=\"18.4\" y2=\"18.4\"><\u002Fline><line x1=\"5.6\" y1=\"18.4\" x2=\"7.7\" y2=\"16.3\"><\u002Fline><line x1=\"16.3\" y1=\"7.7\" x2=\"18.4\" y2=\"5.6\"><\u002Fline><\u002Fg><\u002Fsvg>\n            <small>Lighting<\u002Fsmall>\n          <\u002Fdiv>\n          <div class=\"pillar\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M3 14 Q 8 4 12 14 T 21 14\"><\u002Fpath><\u002Fsvg>\n            <small>Effects<\u002Fsmall>\n          <\u002Fdiv>\n          <div class=\"pillar\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M3 17 Q 8 7 13 17 T 21 13\"><\u002Fpath><polyline points=\"17,11 21,13 19,17\"><\u002Fpolyline><\u002Fsvg>\n            <small>Animations<\u002Fsmall>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- 4 DESIGN TOKENS -->\n      <section class=\"panel acc-2\">\n        <header class=\"panel__head\">\n          <span class=\"panel__num\">4<\u002Fspan>\n          <div class=\"panel__title\">Design Tokens <span class=\"panel__sub\">(the DNA)<\u002Fspan><\u002Fdiv>\n        <\u002Fheader>\n        <p class=\"panel__lede\">Tokens are reusable values. They keep everything consistent. Change once → changes everywhere.<\u002Fp>\n        <div class=\"code\">\n<pre><span class=\"tk-fn\">:root<\u002Fspan> {\n  <span class=\"tk-key\">--chr-color-prism<\u002Fspan>:    <span class=\"tk-val\">#7df9ff<\u002Fspan>;\n  <span class=\"tk-key\">--chr-color-quasar<\u002Fspan>:   <span class=\"tk-val\">#7b2cff<\u002Fspan>;\n  <span class=\"tk-key\">--chr-color-magenta<\u002Fspan>: <span class=\"tk-val\">#ff51e0<\u002Fspan>;\n\n  <span class=\"tk-key\">--chr-space-sm<\u002Fspan>:       <span class=\"tk-val\">8px<\u002Fspan>;\n  <span class=\"tk-key\">--chr-space-md<\u002Fspan>:       <span class=\"tk-val\">16px<\u002Fspan>;\n  <span class=\"tk-key\">--chr-space-lg<\u002Fspan>:       <span class=\"tk-val\">32px<\u002Fspan>;\n\n  <span class=\"tk-key\">--chr-radius-card<\u002Fspan>:    <span class=\"tk-val\">24px<\u002Fspan>;\n  <span class=\"tk-key\">--chr-shadow-glow<\u002Fspan>:    <span class=\"tk-num\">0<\u002Fspan> <span class=\"tk-num\">0<\u002Fspan> <span class=\"tk-num\">40px<\u002Fspan> <span class=\"tk-fn\">rgba<\u002Fspan>(<span class=\"tk-num\">125<\u002Fspan>,<span class=\"tk-num\">249<\u002Fspan>,<span class=\"tk-num\">255<\u002Fspan>,<span class=\"tk-num\">0.35<\u002Fspan>);\n  <span class=\"tk-key\">--chr-font-display<\u002Fspan>:   <span class=\"tk-str\">'Orbitron'<\u002Fspan>, sans-serif;\n}<\u002Fpre>\n        <\u002Fdiv>\n        <div class=\"aside-handwriting cyan\">\n          <svg viewBox=\"0 0 40 20\" fill=\"none\"><path d=\"M2 4 Q 20 18 38 8\" stroke=\"currentColor\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          This is the visual language of your universe!\n        <\u002Fdiv>\n      <\u002Fsection>\n\n    <\u002Fdiv>\n\n    <!-- ============================== CENTER COLUMN -->\n    <div class=\"col-center\">\n      <section class=\"cinema\">\n        <header class=\"cinema__head\">\n          <h2>The 6-Visual Layer System<\u002Fh2>\n          <em>(your cinematic engine)<\u002Fem>\n        <\u002Fheader>\n\n        <div class=\"layers\">\n\n          <!-- L1 -->\n          <article class=\"layer\" style=\"--bg-c: var(--hue-1);\">\n            <div class=\"layer__circle\">1<\u002Fdiv>\n            <div class=\"layer__copy\">\n              <h3>Nebula Background<\u002Fh3>\n              <p>The emotional atmosphere. Sets the tone.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"layer__art lay-nebula\"><\u002Fdiv>\n          <\u002Farticle>\n\n          <!-- L2 -->\n          <article class=\"layer\" style=\"--bg-c: var(--hue-2);\">\n            <div class=\"layer__circle\">2<\u002Fdiv>\n            <div class=\"layer__copy\">\n              <h3>Crystal Structures<\u002Fh3>\n              <p>Visual anchors. Adds depth and holographic refraction.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"layer__art lay-crystal\">\n              <svg viewBox=\"0 0 240 76\" fill=\"none\" preserveAspectRatio=\"xMidYMid slice\">\n                <defs>\n                  <linearGradient id=\"cx1\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#67e8f9\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#a78bfa\"><\u002Fstop><\u002FlinearGradient>\n                  <linearGradient id=\"cx2\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#c4b5fd\"><\u002Fstop><stop offset=\"100%\" stop-color=\"#f472b6\"><\u002Fstop><\u002FlinearGradient>\n                <\u002Fdefs>\n                <polygon points=\"40,62 50,28 62,18 70,28 70,62\" fill=\"rgba(167,139,250,0.20)\" stroke=\"url(#cx1)\" stroke-width=\"1.4\"><\u002Fpolygon>\n                <polygon points=\"78,68 95,40 110,30 122,42 122,68\" fill=\"rgba(103,232,249,0.20)\" stroke=\"url(#cx2)\" stroke-width=\"1.4\"><\u002Fpolygon>\n                <polygon points=\"125,62 135,20 150,8 162,22 162,62\" fill=\"rgba(244,114,182,0.16)\" stroke=\"url(#cx1)\" stroke-width=\"1.6\"><\u002Fpolygon>\n                <polygon points=\"170,66 182,32 196,22 208,34 208,66\" fill=\"rgba(167,139,250,0.18)\" stroke=\"url(#cx2)\" stroke-width=\"1.4\"><\u002Fpolygon>\n                <polygon points=\"200,72 212,46 222,38 230,46 230,72\" fill=\"rgba(103,232,249,0.18)\" stroke=\"url(#cx1)\" stroke-width=\"1.2\"><\u002Fpolygon>\n                <line x1=\"50\" y1=\"28\" x2=\"70\" y2=\"28\" stroke=\"#fff\" stroke-width=\"0.5\" opacity=\"0.5\"><\u002Fline>\n                <line x1=\"95\" y1=\"40\" x2=\"122\" y2=\"42\" stroke=\"#fff\" stroke-width=\"0.5\" opacity=\"0.5\"><\u002Fline>\n                <line x1=\"135\" y1=\"20\" x2=\"162\" y2=\"22\" stroke=\"#fff\" stroke-width=\"0.5\" opacity=\"0.5\"><\u002Fline>\n              <\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Farticle>\n\n          <!-- L3 -->\n          <article class=\"layer\" style=\"--bg-c: var(--hue-3);\">\n            <div class=\"layer__circle\">3<\u002Fdiv>\n            <div class=\"layer__copy\">\n              <h3>Particle Field<\u002Fh3>\n              <p>Adds life, motion and scale.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"layer__art lay-particles\"><\u002Fdiv>\n          <\u002Farticle>\n\n          <!-- L4 -->\n          <article class=\"layer\" style=\"--bg-c: var(--hue-4);\">\n            <div class=\"layer__circle\">4<\u002Fdiv>\n            <div class=\"layer__copy\">\n              <h3>Holographic Cards<\u002Fh3>\n              <p>Information surfaces. Where content lives.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"layer__art lay-holo\">\n              <div class=\"h-card\" style=\"--hc-frame: linear-gradient(90deg, #67e8f9, #a78bfa); --hc-glow: rgba(103,232,249,0.45);\">\n                <div class=\"av\"><\u002Fdiv>\n                <span class=\"ln\"><\u002Fspan><span class=\"ln s\"><\u002Fspan><span class=\"ln s\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"h-card\" style=\"--hc-frame: linear-gradient(90deg, #a78bfa, #f472b6); --hc-glow: rgba(167,139,250,0.45); --hc-a: #a78bfa; --hc-b: #f472b6;\">\n                <div class=\"av\"><\u002Fdiv>\n                <span class=\"ln\"><\u002Fspan><span class=\"ln s\"><\u002Fspan><span class=\"ln s\"><\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"h-card\" style=\"--hc-frame: linear-gradient(90deg, #fcd34d, #fb7185); --hc-glow: rgba(252,211,77,0.45); --hc-a: #fcd34d; --hc-b: #fb7185;\">\n                <div class=\"av\"><\u002Fdiv>\n                <span class=\"ln\"><\u002Fspan><span class=\"ln s\"><\u002Fspan><span class=\"ln s\"><\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n\n          <!-- L5 -->\n          <article class=\"layer\" style=\"--bg-c: var(--hue-5);\">\n            <div class=\"layer__circle\">5<\u002Fdiv>\n            <div class=\"layer__copy\">\n              <h3>Glow Overlays<\u002Fh3>\n              <p>Cinematic lighting. Brings everything together.<\u002Fp>\n            <\u002Fdiv>\n            <div class=\"layer__art lay-glow\"><\u002Fdiv>\n          <\u002Farticle>\n\n          <!-- L6 -->\n          <article class=\"layer\" style=\"--bg-c: var(--hue-6);\">\n            <div class=\"layer__circle\">6<\u002Fdiv>\n            <div class=\"layer__copy\">\n              <h3>Interactive UI<\u002Fh3>\n              <p>The layer the user interacts with.
