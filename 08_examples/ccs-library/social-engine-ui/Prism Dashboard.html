<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Prism — Social Engine</title>
  <link rel="stylesheet" href="lib/metachromatic.css"/>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body.mc { background: #050812; }
    *::-webkit-scrollbar { width: 8px; height: 8px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    button { font-family: 'Prompt', sans-serif; }
    input, textarea { font-family: 'Prompt', sans-serif; }

    /* ── MIN CARD MODE ──────────────────────────────────────────
       A simpler, calmer skin. Drops decorative borders/shadows,
       quiets section labels, gives charts and portraits more breathing
       room. Toggle by adding .min-cards to the body. */
    body.min-cards .mc-glow,
    body.min-cards [data-min-hide],
    body.min-cards .mc-corner,
    body.min-cards .mc-status-glyph { display: none !important; }

    body.min-cards [data-panel] {
      box-shadow: none !important;
      border: 1px solid rgba(255,255,255,0.05) !important;
      background: rgba(10,14,26,0.4) !important;
      backdrop-filter: blur(10px) saturate(120%) !important;
    }
    body.min-cards [data-panel-glow] {
      box-shadow: none !important;
    }
    body.min-cards [data-decoration] { opacity: 0.35 !important; }
    body.min-cards [data-min-quiet] {
      letter-spacing: 0.04em !important;
      opacity: 0.55 !important;
      font-weight: 400 !important;
    }
    /* Promote the headline visualization on each card */
    body.min-cards [data-hero-viz] {
      transform: scale(1.04);
      transform-origin: center;
    }
    /* Strip noisy mono labels */
    body.min-cards [data-mono-noise] { display: none !important; }
    /* Calmer chips */
    body.min-cards [data-chip] {
      background: rgba(255,255,255,0.04) !important;
      border: 1px solid rgba(255,255,255,0.08) !important;
      box-shadow: none !important;
      color: rgba(255,255,255,0.7) !important;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="src/data.js"></script>
</head>
<body class="mc">
  <div id="root"></div>

  <script type="text/babel" src="lib/design-canvas.jsx"></script>
  <script type="text/babel" src="lib/tweaks-panel.jsx"></script>
  <script type="text/babel" src="src/portraits.jsx"></script>
  <script type="text/babel" src="src/charts.jsx"></script>
  <script type="text/babel" src="src/panels.jsx"></script>
  <script type="text/babel" src="src/sub-panels.jsx"></script>
  <script type="text/babel" src="src/dashboard-original.jsx"></script>
  <script type="text/babel" src="src/dashboard-constellation.jsx"></script>
  <script type="text/babel" src="src/dashboard-cinematic.jsx"></script>
  <script type="text/babel" src="src/dashboard-mobile.jsx"></script>
  <script type="text/babel" src="src/dashboard-live.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "density": "regular",
      "glassBlur": 16,
      "glassOpacity": 0.65,
      "bgGlow": "cyan",
      "trendRange": "7d",
      "selectedChar": "mira",
      "layout": "all",
      "cardMode": "max"
    }/*EDITMODE-END*/;

    function App() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [charId, setCharId] = React.useState(t.selectedChar || 'mira');
      const [liveState, setLiveState] = React.useState('idle'); // 'idle' | 'minimized' | 'overlay'
      // sync tweak ↔ state
      React.useEffect(() => { if (t.selectedChar !== charId) setCharId(t.selectedChar); }, [t.selectedChar]);
      // Toggle body class for min/max card mode
      React.useEffect(() => {
        document.body.classList.toggle('min-cards', t.cardMode === 'min');
      }, [t.cardMode]);
      const setCharIdSync = (id) => { setCharId(id); setTweak('selectedChar', id); };

      const char = window.PRISM_DATA.characters.find(c=>c.id===charId) || window.PRISM_DATA.characters[0];

      const onSelectTab = (tab) => {
        if (tab === 'live') {
          // open as full-page (also show below) — and clear minimized state
          setLiveState('full');
          // scroll to live artboard if it exists
          setTimeout(()=>{
            const el = document.querySelector('[data-dc-artboard="live"]');
            if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
          }, 50);
        }
      };

      const sharedProps = { tweaks: t, char, setCharId: setCharIdSync, charId, onSelectTab, setTweak };
      const liveProps = { ...sharedProps,
        onMinimize: () => setLiveState('minimized'),
      };

      const showOriginal = t.layout === 'all' || t.layout === 'original';
      const showConst = t.layout === 'all' || t.layout === 'constellation';
      const showCine = t.layout === 'all' || t.layout === 'cinematic';
      const showMobile = t.layout === 'all' || t.layout === 'mobile';
      const showLive = t.layout === 'all' || t.layout === 'live';

      return (
        <React.Fragment>
          <DesignCanvas>
            {showOriginal && (
              <DCSection id="desktop" title="Desktop · Faithful" subtitle="The reference dashboard, faithfully recreated in MetaChromatic">
                <DCArtboard id="original" label="Original — 4-column command HUD" width={1400} height={920}>
                  <DashboardOriginal {...sharedProps}/>
                </DCArtboard>
              </DCSection>
            )}
            {showConst && (
              <DCSection id="constellation" title="Desktop · Constellation-first" subtitle="The Veil Map takes center stage">
                <DCArtboard id="constellation" label="Variation A — Constellation hero" width={1400} height={1100}>
                  <DashboardConstellation {...sharedProps}/>
                </DCArtboard>
              </DCSection>
            )}
            {showCine && (
              <DCSection id="cinematic" title="Desktop · Cinematic" subtitle="Editorial spread, character-as-poster">
                <DCArtboard id="cinematic" label="Variation B — Cinematic spread" width={1400} height={1180}>
                  <DashboardCinematic {...sharedProps}/>
                </DCArtboard>
              </DCSection>
            )}
            {showLive && (
              <DCSection id="live" title="Desktop · Live Tab" subtitle="Video-call style — minimize to bottom dock as overlay window">
                <DCArtboard id="live" label="Live — In session with character" width={1400} height={1280}>
                  {liveState === 'minimized'
                    ? <LiveMinimizedView char={char} onExpand={()=>setLiveState('overlay')} onClose={()=>setLiveState('full')} tweaks={t} {...sharedProps}/>
                    : <DashboardLive {...liveProps}/>
                  }
                </DCArtboard>
              </DCSection>
            )}
            {showMobile && (
              <DCSection id="mobile" title="Mobile companion" subtitle="On-the-go check-in">
                <DCArtboard id="mobile" label="iPhone — Companion" width={390} height={844}>
                  <DashboardMobile {...sharedProps}/>
                </DCArtboard>
              </DCSection>
            )}
          </DesignCanvas>

          <TweaksPanel>
            <TweakSection label="Display"/>
            <TweakRadio label="Card mode" value={t.cardMode}
                        options={[{value:'max',label:'Max'},{value:'min',label:'Min'}]}
                        onChange={v=>setTweak('cardMode', v)}/>
            <TweakSection label="Layout"/>
            <TweakSelect label="Show" value={t.layout}
                         options={[['all','All views'],['original','Original only'],['constellation','Constellation only'],['cinematic','Cinematic only'],['live','Live only'],['mobile','Mobile only']]}
                         onChange={v=>setTweak('layout', v)}/>
            <TweakRadio label="Density" value={t.density}
                        options={['compact','regular','comfy']}
                        onChange={v=>setTweak('density', v)}/>
            <TweakSection label="Active character"/>
            <TweakSelect label="Character" value={charId}
                         options={window.PRISM_DATA.characters.map(c=>[c.id, `${c.name} — ${c.role}`])}
                         onChange={v=>setCharIdSync(v)}/>
            <TweakSection label="Atmosphere"/>
            <TweakRadio label="Background glow" value={t.bgGlow}
                        options={['cyan','violet','none']}
                        onChange={v=>setTweak('bgGlow', v)}/>
            <TweakSlider label="Glass blur" value={t.glassBlur} min={4} max={40} step={1} unit="px"
                         onChange={v=>setTweak('glassBlur', v)}/>
            <TweakSlider label="Panel opacity" value={t.glassOpacity} min={0.3} max={0.95} step={0.05}
                         onChange={v=>setTweak('glassOpacity', v)}/>
            <TweakSection label="Charts"/>
            <TweakRadio label="Trend range" value={t.trendRange}
                        options={['7d','3d']}
                        onChange={v=>setTweak('trendRange', v)}/>
          </TweaksPanel>

          {liveState === 'overlay' && (
            <LiveOverlay char={char} setCharId={setCharIdSync} charId={charId}
              tweaks={t}
              onMinimize={()=>setLiveState('minimized')}
              onClose={()=>setLiveState('full')}/>
          )}

          {/* Floating Max/Min quick toggle — always visible */}
          <div style={{position:'fixed', top:14, right:80, zIndex:40, fontFamily:'Prompt'}}>
            <CardModeToggle tweaks={t} setTweak={setTweak} accent={188}/>
          </div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
