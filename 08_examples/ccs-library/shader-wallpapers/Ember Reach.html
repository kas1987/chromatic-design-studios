<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ember Reach — MetaChromatic Wallpaper</title>
<link rel="icon" href="lib/metachromatic-icon.svg">
<link rel="stylesheet" href="lib/wallpaper.css">
</head>
<body>
<div id="mc-vignette"></div>

<script type="x-shader/x-fragment" id="frag">
void main(){
  vec2 st = gl_FragCoord.xy / u_res;
  vec2 m  = (u_mouse - 0.5); m.x *= u_res.x/u_res.y;
  float t = u_time * (0.5 + u_motion*0.7);
  vec3 rp = rippleAt(st);

  vec2 z = (st - 0.5)*0.94 + 0.5;
  z += (u_mouse - 0.5) * vec2(0.016, 0.011);

  float low = smoothstep(0.72, 0.08, st.y);   // lower = molten ground

  // ── base: faint heat wobble keeps it alive ──
  vec2 wob = vec2(sin(st.y*28.0 + t*3.0), 0.0) * 0.0017 * (0.35 + low);
  vec3 base = bg(z + wob);

  // ── effect: heat haze + ripple ──
  float h = fbm(st*vec2(8.0,18.0) + vec2(0.0, -t*2.2));
  vec2 haze = vec2(h - 0.5, 0.0) * 0.022 * low + rp.xy * 0.045;
  vec3 fx = bg(z + wob + haze);

  // lava breathes — pulse the bright pixels
  float lum = dot(fx, vec3(0.299,0.587,0.114));
  float pulse = 0.6 + 0.4*sin(t*1.4 + st.x*4.0);
  fx += fx * smoothstep(0.42, 0.92, lum) * pulse * 0.5;

  // rising embers
  float em = 0.0;
  for(int i=0;i<3;i++){
    float fi = float(i);
    vec2 g = st * vec2(42.0 + fi*16.0, 24.0 + fi*9.0);
    g.y += t*(1.1 + fi*0.6);
    vec2 ip = floor(g), fp = fract(g);
    float hh = hash21(ip + fi*5.0);
    vec2 cp = vec2(hash21(ip+fi+1.0), hash21(ip+fi+2.0));
    em += smoothstep(0.13, 0.0, length(fp-cp)) * step(0.72, hh) * (0.55 + 0.45*sin(t*5.0 + hh*30.0));
  }
  fx += em * mix(vec3(1.0,0.55,0.12), palRamp(0.85), 0.35) * 1.3 * (0.3 + low);

  // cursor heat + click flare
  vec2 c = (st - 0.5); c.x *= u_res.x/u_res.y;
  float dm = length(c - m);
  fx += exp(-dm*3.0) * vec3(1.0,0.6,0.2) * 0.45 * u_present;
  fx += rp.z * mix(vec3(1.0,0.7,0.2), palRamp(0.9), 0.4) * 1.7;

  vec3 col = mix(base, fx, u_blend);
  col += rp.z * 0.3;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script src="lib/chrome-dock.js"></script>
<script src="lib/shader-runtime.js"></script>
<script>
  MCWallpaper.init({ index: 4, fragId: 'frag', motion: 0.6, blend: 0.5, image: 'assets/bg/lava.jpg' });
</script>
</body>
</html>
