<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Liquid Chromatic — MetaChromatic Wallpaper</title>
<link rel="icon" href="lib/metachromatic-icon.svg">
<link rel="stylesheet" href="lib/wallpaper.css">
</head>
<body>
<div id="mc-vignette"></div>

<script type="x-shader/x-fragment" id="frag">
void main(){
  vec2 st = gl_FragCoord.xy / u_res;
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / u_res.y;
  float t = u_time * 0.12 * (0.35 + u_motion);

  vec2 m = (u_mouse - 0.5); m.x *= u_res.x/u_res.y;

  // click shockwaves push the field
  vec3 rp = rippleAt(st);
  uv += rp.xy * 0.28;

  // cursor pulls the flow toward it
  vec2 toM = uv - m;
  float md = length(toM);
  uv -= toM * 0.18 * exp(-md*1.6) * u_present;

  float fl = u_flow;   // turbulence amount

  // ── iterative domain warping (flowing liquid) ──
  vec2 q = vec2(fbm(uv*1.4 + vec2(0.0, t)),
                fbm(uv*1.4 + vec2(5.2, 1.3) - t*0.6));
  vec2 r2 = vec2(fbm(uv*1.4 + (2.0+1.6*fl)*q + vec2(1.7,9.2) - m*0.5 + t*1.1),
                 fbm(uv*1.4 + (2.0+1.6*fl)*q + vec2(8.3,2.8) + t*0.9));
  float f = fbm(uv*1.4 + (2.4+1.5*fl)*r2);

  float shade = f + 0.16*length(r2)*fl;
  shade += 0.22 * exp(-md*2.2) * u_present;   // brighter near cursor
  shade += rp.z * 0.55;                        // ripple energy

  float raw = shade*1.05 + t*0.18;
  float idx = fract(raw);

  // ── crystalline mode: quantize into faceted glass + leaded seams ──
  float seam = 0.0;
  if(u_crystal > 0.001){
    float steps = mix(46.0, 7.0, u_crystal);
    float qi = floor(idx*steps)/steps + 0.5/steps;
    idx = mix(idx, qi, u_crystal);
    float fr = fract(raw*steps);
    seam = (1.0 - smoothstep(0.0, 0.13, min(fr, 1.0-fr))) * u_crystal;
  }

  vec3 col = palRamp(idx);
  col *= 0.5 + 0.75*f;                          // body depth
  col += rp.z * palRamp(fract(idx+0.5)) * 1.3;  // bloom on ripple
  col += pow(max(0.0, 1.0 - md*1.1), 6.0) * 0.25 * u_present;  // cursor sheen

  // leaded seams between glass facets
  col *= 1.0 - seam*0.72;
  col += seam * palRamp(fract(idx+0.5)) * 0.18;

  col *= 1.0 - 0.26*dot(uv,uv);                 // vignette
  col = pow(col, vec3(0.92));                   // gentle lift
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script src="lib/chrome-dock.js"></script>
<script src="lib/shader-runtime.js"></script>
<script>
  MCWallpaper.init({ index: 1, fragId: 'frag', motion: 0.75 });
</script>
</body>
</html>
