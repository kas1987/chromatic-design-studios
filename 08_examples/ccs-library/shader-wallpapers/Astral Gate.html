<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Astral Gate — MetaChromatic Wallpaper</title>
<link rel="icon" href="lib/metachromatic-icon.svg">
<link rel="stylesheet" href="lib/wallpaper.css">
</head>
<body>
<div id="mc-vignette"></div>

<script type="x-shader/x-fragment" id="frag">
void main(){
  vec2 st = gl_FragCoord.xy / u_res;
  vec2 c  = st - 0.5; c.x *= u_res.x/u_res.y;
  vec2 m  = (u_mouse - 0.5); m.x *= u_res.x/u_res.y;
  float t = u_time * (0.15 + u_motion*0.4);
  vec3 rp = rippleAt(st);

  vec2 z = (st - 0.5)*0.92 + 0.5;
  z += (u_mouse - 0.5) * vec2(0.024, 0.016);

  // gentle swirl around the portal (stronger with blend)
  float rad = length(c);
  float sw = (0.10*u_blend + 0.015) * exp(-rad*1.3) * sin(t*0.5);
  vec2 zc = z - 0.5; float cs = cos(sw), sn = sin(sw);
  zc = mat2(cs,-sn,sn,cs) * zc;
  vec2 zs = zc + 0.5;

  // cursor lens warp
  vec2 dd = c - m; float l = dot(dd,dd);
  vec2 lens = -dd/(l + 0.05) * 0.012 * u_present;
  zs += vec2(lens.x * u_res.y/u_res.x, lens.y);
  zs += rp.xy * 0.03;

  // base — already drifting from the swirl
  vec3 base = bg(zs);

  // chromatic aberration radiating from centre
  float ab = 0.003 + 0.006*u_blend + 0.012*rp.z;
  vec2 dir = normalize(c + 1e-4);
  vec3 fx;
  fx.r = bg(zs + dir*ab).r;
  fx.g = bg(zs).g;
  fx.b = bg(zs - dir*ab).b;

  // bloom on the bright crystal/energy
  float lum = dot(fx, vec3(0.299,0.587,0.114));
  fx += fx * smoothstep(0.55, 0.95, lum) * (0.45 + 0.4*sin(t*1.2)) * 0.6;

  // star twinkle
  vec2 sg = st * vec2(150.0, 86.0);
  vec2 ip = floor(sg); float hh = hash21(ip);
  float star = step(0.95, hh) * smoothstep(0.12, 0.0, length(fract(sg)-0.5)) * (0.5 + 0.5*sin(t*4.0 + hh*30.0));
  fx += star * mix(vec3(0.8,0.85,1.0), palRamp(0.3), 0.5) * 0.9;

  // click energy ring + cursor halo
  fx += rp.z * palRamp(0.5) * 1.7;
  fx += exp(-l*2.5) * palRamp(0.4) * 0.32 * u_present;

  vec3 col = mix(base, fx, u_blend);
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script src="lib/chrome-dock.js"></script>
<script src="lib/shader-runtime.js"></script>
<script>
  MCWallpaper.init({ index: 5, fragId: 'frag', motion: 0.6, blend: 0.55, image: 'assets/bg/cosmic.jpg' });
</script>
</body>
</html>
